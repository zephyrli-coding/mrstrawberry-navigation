services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        HTTP_PROXY: ${DOCKER_BUILD_HTTP_PROXY:-}
        HTTPS_PROXY: ${DOCKER_BUILD_HTTPS_PROXY:-}
    container_name: navigation-site-backend
    restart: unless-stopped
    expose:
      - "8002"
    volumes:
      - ./data:/app/data
    environment:
      - DATABASE_URL=sqlite:////app/data/navigation.db
      - AUTH_SERVICE_URL=${AUTH_SERVICE_URL:-http://auth-service:20263}
      - AUTH_SERVICE_JWKS_URL=${AUTH_SERVICE_JWKS_URL:-http://auth-service:20263/.well-known/jwks.json}
      - AUTH_SERVICE_ISSUER=${AUTH_SERVICE_ISSUER:-http://localhost:20263}
      - AUTH_CLIENT_ID=${AUTH_CLIENT_ID:-navigation}
      - AUTH_CLIENT_SECRET=${AUTH_CLIENT_SECRET}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:20261}
      - REDIS_URL=redis://session-redis:6379/0
      - SESSION_TTL_SECONDS=${SESSION_TTL_SECONDS:-604800}
      - SESSION_COOKIE_SECURE=${SESSION_COOKIE_SECURE:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:20261}
      - SMTP_HOST=${SMTP_HOST:-smtp.163.com}
      - SMTP_PORT=${SMTP_PORT:-465}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
    networks:
      - navigation-site-network
      - compound-internal
    depends_on:
      session-redis:
        condition: service_healthy

  session-redis:
    image: redis:7-alpine
    container_name: navigation-session-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - navigation_session_data:/data
    networks:
      - navigation-site-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=/api
        - VITE_AUTH_SERVICE_URL=${AUTH_SERVICE_PUBLIC_URL:-http://localhost:20263}
        - VITE_AUTH_CLIENT_ID=${AUTH_CLIENT_ID:-navigation}
    container_name: navigation-site-frontend
    restart: unless-stopped
    ports:
      - "${PORT:-20261}:80"
    depends_on:
      - backend
    networks:
      - navigation-site-network
      - compound-edge

networks:
  navigation-site-network:
    driver: bridge
  compound-internal:
    name: compound-internal
    external: true
  compound-edge:
    name: compound-edge
    external: true

volumes:
  navigation_session_data:
