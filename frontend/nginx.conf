server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # Vite assets are content-hashed and safe to cache indefinitely.
    location /assets/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Proxy /api/* to backend, stripping the /api prefix
    # (mirrors vite dev proxy: rewrite path.replace(/^\/api/, ''))
    location /api/ {
        proxy_pass http://navigation-site-backend:8002/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://navigation-site-backend:8002/health;
    }
}
